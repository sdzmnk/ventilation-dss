# Dev overrides — auto-loaded by `docker compose up` alongside docker-compose.yml.
# Java Spring Boot services (auth, user, config, discovery, chat, gateway) use Spring DevTools
# for fast restarts. data-service and analytic-service keep Python hot-reload via uvicorn.

services:
  auth-service:
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"

  user-service:
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"

  config-service:
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"

  discovery-service:
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"

  chat-service:
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"

  gateway-service:
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"

  data-service:
    volumes:
      - ./services/data-service/app:/app/app
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port ${SERVICE_PORT:-8003} --reload --reload-dir /app/app"]

  analytic-service:
    volumes:
      - ./services/analytic-service/app:/app/app
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port ${SERVICE_PORT:-8004} --reload --reload-dir /app/app"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_PROXY_TARGET: http://gateway-service:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
