version: "3.9"

x-base: &base
  restart: unless-stopped
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    <<: *base
    build: ./services/auth-service
    environment:
      SERVICE_NAME: auth-service
      SERVICE_PORT: 8001
    ports:
      - "8001:8001"

  user-service:
    <<: *base
    build: ./services/user-service
    environment:
      SERVICE_NAME: user-service
      SERVICE_PORT: 8002
    ports:
      - "8002:8002"

  data-service:
    <<: *base
    build: ./services/data-service
    environment:
      SERVICE_NAME: data-service
      SERVICE_PORT: 8003
      VENT_DATASET_CSV: /data/ventilation_history.csv
      VENT_BASELINES_JSON: /data/ventilation_baselines.json
    volumes:
      - ./db/ventilation_history.csv:/data/ventilation_history.csv:ro
      - ./db/ventilation_baselines.json:/data/ventilation_baselines.json:ro
    ports:
      - "8003:8003"

  analytic-service:
    <<: *base
    build: ./services/analytic-service
    environment:
      SERVICE_NAME: analytic-service
      SERVICE_PORT: 8004
      VENT_BASELINES_JSON: /data/ventilation_baselines.json
      VENT_DATASET_CSV: /data/ventilation_history.csv
    volumes:
      - ./db/ventilation_baselines.json:/data/ventilation_baselines.json:ro
      - ./db/ventilation_history.csv:/data/ventilation_history.csv:ro
    ports:
      - "8004:8004"

  config-service:
    <<: *base
    build: ./services/config-service
    environment:
      SERVICE_NAME: config-service
      SERVICE_PORT: 8005
    ports:
      - "8005:8005"

  discovery-service:
    <<: *base
    build: ./services/discovery-service
    environment:
      SERVICE_NAME: discovery-service
      SERVICE_PORT: 8006
    ports:
      - "8006:8006"

  chat-service:
    <<: *base
    build: ./services/chat-service
    environment:
      SERVICE_NAME: chat-service
      SERVICE_PORT: 8007
    ports:
      - "8007:8007"

  gateway-service:
    <<: *base
    build: ./services/gateway-service
    environment:
      SERVICE_NAME: gateway-service
      SERVICE_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      data-service:
        condition: service_started
      analytic-service:
        condition: service_started
      config-service:
        condition: service_started
      discovery-service:
        condition: service_started
      chat-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - gateway-service

volumes:
  pgdata:
